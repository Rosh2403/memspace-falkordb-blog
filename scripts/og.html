<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<!-- Source for assets/og.png. Render with: npm-free, see README "Share image". -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{background-attachment:scroll}
  .og{box-sizing:border-box;width:1200px;height:630px;padding:64px 64px 56px 72px;display:grid;grid-template-columns:1fr 520px;gap:24px;align-items:center}
  .og h1{margin:0 0 22px;color:var(--ink);font:600 66px/1.02 var(--sans);letter-spacing:-0.045em}
  .og p{margin:0;color:var(--text);font:400 26px/1.4 var(--sans);max-width:520px}
  body > .brand{position:absolute;left:72px;bottom:44px;font-size:22px}
  body > .brand svg{width:34px;height:34px}
  body > .url{position:absolute;right:64px;bottom:50px;color:var(--muted);font:500 17px var(--mono)}
  .schematic .trace-live{animation:none;stroke-dasharray:none;stroke-dashoffset:0;opacity:.9}
</style></head>
<body><div class="og">
  <div><h1>Dot, Muse and Grok Bot now share one memory</h1><p>An ontology on FalkorDB, built at Graph Hacks.</p></div>
  <div><svg class="schematic hero-schematic" viewBox="0 0 560 440" role="img" aria-labelledby="hero-title hero-desc">
          <title id="hero-title">Three assistants connected to one memory graph</title>
          <desc id="hero-desc">Dot, Muse and Grok Bot each connect to the Memspace server, which stores facts in a FalkorDB graph: Afshal Gulam works on Loop, and a dark-mode-first decision was made by Afshal about Loop.</desc>
          <defs>
            <linearGradient id="spectrum" gradientUnits="userSpaceOnUse" x1="80" y1="0" x2="306" y2="0">
              <stop offset="0" stop-color="#12b0d8"/><stop offset=".55" stop-color="#6b4cff"/><stop offset="1" stop-color="#f5873a"/>
            </linearGradient>
            <clipPath id="tile-clip"><rect width="56" height="56" rx="15"/></clipPath>
            <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8z" fill="#1f5edb"/></marker>
          </defs>

          <path class="trace" d="M80 88H140Q152 88 152 100V193Q152 205 164 205H226"/>
          <path class="trace" d="M80 220H226"/>
          <path class="trace" d="M80 352H140Q152 352 152 340V247Q152 235 164 235H226"/>
          <path class="trace-live" d="M80 88H140Q152 88 152 100V193Q152 205 164 205H226"/>
          <path class="trace-live" d="M80 220H226"/>
          <path class="trace-live" d="M80 352H140Q152 352 152 340V247Q152 235 164 235H226"/>

          <g transform="translate(24 60)">
            <rect width="56" height="56" rx="15" fill="#fff" stroke="#e1e5ec"/>
            <image href="../assets/logos/dot.png" width="56" height="56" clip-path="url(#tile-clip)"/>
            <text class="label-ink" x="28" y="76" text-anchor="middle">Dot</text>
            <text class="label" x="28" y="91" text-anchor="middle">OpenAI</text>
          </g>
          <g transform="translate(24 192)">
            <rect width="56" height="56" rx="15" fill="#fff" stroke="#e1e5ec"/>
            <image href="../assets/logos/muse.svg" x="10" y="10" width="36" height="36"/>
            <text class="label-ink" x="28" y="76" text-anchor="middle">Muse</text>
            <text class="label" x="28" y="91" text-anchor="middle">Meta</text>
          </g>
          <g transform="translate(24 324)">
            <rect width="56" height="56" rx="15" fill="#fff" stroke="#e1e5ec"/>
            <image href="../assets/logos/grok-bot.png" width="56" height="56" clip-path="url(#tile-clip)"/>
            <text class="label-ink" x="28" y="76" text-anchor="middle">Grok Bot</text>
            <text class="label" x="28" y="91" text-anchor="middle">xAI</text>
          </g>

          <rect class="core" x="226" y="178" width="80" height="84" rx="16"/>
          <text x="266" y="217" text-anchor="middle" fill="#fff" font-size="11.5" font-weight="500">Memspace</text>
          <text x="266" y="234" text-anchor="middle" fill="#9aa1b2" font-size="10">MCP</text>
          <path class="trace" d="M306 220H330"/>
          <circle cx="330" cy="220" r="3" fill="#6b4cff"/>

          <rect x="330" y="28" width="216" height="386" rx="18" fill="rgba(255,255,255,.55)" stroke="#c9d0db" stroke-dasharray="4 5"/>
          <text class="label" x="438" y="402" text-anchor="middle">FalkorDB graph</text>

          <path d="M450 103V188" stroke="#1f5edb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
          <text class="rel" x="457" y="150">works on</text>
          <path d="M370 325V105" stroke="#1f5edb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
          <text class="rel" x="377" y="292">decided by</text>
          <path d="M470 325V240" stroke="#1f5edb" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
          <text class="rel" x="477" y="292">about</text>

          <g>
            <rect class="node-box" x="345" y="55" width="160" height="48" rx="10"/>
            <circle cx="359" cy="72" r="3" fill="#7c5cff"/>
            <text class="label" x="367" y="75">person</text>
            <text class="label-ink" x="355" y="93">Afshal Gulam</text>
          </g>
          <g>
            <rect class="node-box" x="400" y="190" width="135" height="48" rx="10"/>
            <circle cx="414" cy="207" r="3" fill="#8a93a6"/>
            <text class="label" x="422" y="210">project</text>
            <text class="label-ink" x="410" y="228">Loop</text>
          </g>
          <g>
            <rect class="node-box" x="345" y="325" width="180" height="48" rx="10"/>
            <circle cx="359" cy="342" r="3" fill="#7a6fb0"/>
            <text class="label" x="367" y="345">decision</text>
            <text class="label-ink" x="355" y="363">Dark-mode-first UI</text>
          </g>
        </svg></div>
</div>
<span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#14161b"/><path d="M9 22V12l7 6 7-6v10" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="12" r="2.6" fill="#6b4cff"/></svg>Memspace</span>
<span class="url">memspace-falkordb-blog.vercel.app</span>
</body></html>
